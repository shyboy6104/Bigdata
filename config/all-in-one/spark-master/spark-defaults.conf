# ===============================================
# Spark Master节点默认配置
# 作用：配置Spark Master节点的基本参数
# 原理：设置Spark应用运行时的默认参数
# ===============================================

# Spark Master地址
spark.master                     spark://master:7077

# 应用名称
spark.app.name                  BigData-Spark-Master

# ===============================================
# Spark 内存角色说明
# SPARK_DAEMON_MEMORY：Spark Master 守护进程自身的 JVM 堆内存
# SPARK_DRIVER_MEMORY：提交应用、构建 DAG 和调度任务的 Driver 内存
# SPARK_EXECUTOR_MEMORY：真正执行 Task、缓存数据的 Executor 内存
# 三者由 Compose 环境变量传入，避免把守护进程内存和作业内存混为一谈。
# ===============================================

# 序列化配置
spark.serializer                org.apache.spark.serializer.KryoSerializer

# 动态资源分配（YARN模式需要External Shuffle Service，此处禁用）
spark.dynamicAllocation.enabled false

# 日志配置
spark.eventLog.enabled          true
spark.eventLog.dir              /opt/spark/data/event-logs

# 网络配置
spark.driver.host               master
spark.driver.bindAddress        0.0.0.0
