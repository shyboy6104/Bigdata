# ===============================================
# Spark Worker节点默认配置
# 作用：配置Spark Worker节点的基本参数
# 原理：设置Spark Worker运行时的默认参数
# ===============================================

# Spark Master地址
spark.master                     spark://master:7077

# ===============================================
# PySpark Executor解释器配置
# Worker接收Python任务后会启动Python Worker进程；该路径必须在每个Worker上存在。
# ===============================================
spark.pyspark.python             /usr/bin/python3
spark.executorEnv.PYSPARK_PYTHON /usr/bin/python3

# ===============================================
# Spark Worker 内存角色说明
# SPARK_DAEMON_MEMORY：Worker 守护进程自身的 JVM 堆内存
# SPARK_WORKER_MEMORY：该 Worker 可分配给一个或多个 Executor 的资源总量
# spark.executor.memory：单个应用的 Executor 内存，由提交参数或 Master 默认配置决定
# 这些概念彼此独立，均由 Compose/提交命令控制，不在此文件重复写死。
# ===============================================

# 序列化配置
spark.serializer                org.apache.spark.serializer.KryoSerializer

# 动态资源分配（YARN模式需要External Shuffle Service，此处禁用）
spark.dynamicAllocation.enabled false

# 网络配置
spark.driver.bindAddress        0.0.0.0
