# ===============================================
# MySQL服务Docker Compose配置文件
# 作用：定义MySQL数据库服务的容器编排配置
# 原理：使用Docker Compose编排MySQL服务，为Hive等组件提供元数据存储
# 依赖：无依赖，属于基础服务
# ===============================================

version: '3.8'

services:
  # ===============================================
  # MySQL服务配置
  # 作用：为Hive等大数据组件提供关系型数据库支持
  # 原理：存储Hive元数据、用户权限等结构化信息
  # 端口映射：3306是MySQL的标准服务端口
  # ===============================================
  mysql:
    image: bigdata-mysql:latest
    container_name: mysql
    hostname: mysql
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./config/mysql/my.cnf:/etc/mysql/my.cnf
      - ./config/environment.conf:/config/environment.conf:ro
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=hive
      - MYSQL_USER=hive
      - MYSQL_PASSWORD=hive
    networks:
      bigdata-net:
        aliases:
          - mysql

volumes:
  mysql_data:

networks:
  bigdata-net:
    external: true
