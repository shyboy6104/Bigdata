# ===============================================
# ZooKeeper集群Docker Compose配置文件
# 作用：定义ZooKeeper分布式协调服务的容器编排配置
# 原理：使用3节点集群实现高可用和容错能力
# 架构：3节点仲裁集群，确保在单节点故障时仍能正常工作
# ===============================================

services:
  # ===============================================
  # ZooKeeper节点1配置
  # 作用：ZooKeeper集群的第一个节点
  # 原理：每个节点有唯一的ID，通过配置文件形成集群
  # 端口映射：容器内 2181 为 ZooKeeper 标准客户端端口；宿主机侧映射到 12181，
  # 避开 Windows 保留端口排除区间 2180-2279（否则 docker 绑定报 HTTP 500 / bind forbidden）。
  # Kafka 通过内部服务名 zoo1:2181 连接，不受宿主机端口改动影响。
  # ===============================================
  zoo1:
    image: bigdata-zookeeper:latest
    container_name: zoo1
    hostname: zoo1
    ports:
      - "12181:2181"  # 宿主机 12181 -> 容器 2181
    environment:
      ZOO_MY_ID: 1  # 节点唯一标识
    volumes:
      - ./config/zookeeper:/config/zookeeper  # 配置目录
      - zoo1_data:/opt/zookeeper/data        # 数据持久化
      - zoo1_datalog:/opt/zookeeper/datalog   # 事务日志持久化
    networks:
      - bigdata-net

  # ===============================================
  # ZooKeeper节点2配置
  # 作用：ZooKeeper集群的第二个节点
  # 原理：通过不同的主机端口实现多节点部署
  # 端口映射：宿主机 12182 -> 容器内 2181
  # ===============================================
  zoo2:
    image: bigdata-zookeeper:latest
    container_name: zoo2
    hostname: zoo2
    ports:
      - "12182:2181"  # 宿主机 12182 -> 容器 2181
    environment:
      ZOO_MY_ID: 2  # 节点唯一标识
    volumes:
      - ./config/zookeeper:/config/zookeeper
      - zoo2_data:/opt/zookeeper/data
      - zoo2_datalog:/opt/zookeeper/datalog
    networks:
      - bigdata-net

  # ===============================================
  # ZooKeeper节点3配置
  # 作用：ZooKeeper集群的第三个节点，形成仲裁集群
  # 原理：3节点集群确保在单节点故障时仍能形成多数派
  # 端口映射：宿主机 12183 -> 容器内 2181
  # ===============================================
  zoo3:
    image: bigdata-zookeeper:latest
    container_name: zoo3
    hostname: zoo3
    ports:
      - "12183:2181"  # 宿主机 12183 -> 容器 2181
    environment:
      ZOO_MY_ID: 3
    volumes:
      - ./config/zookeeper:/config/zookeeper
      - zoo3_data:/opt/zookeeper/data
      - zoo3_datalog:/opt/zookeeper/datalog
    networks:
      - bigdata-net

volumes:
  zoo1_data:
  zoo1_datalog:
  zoo2_data:
  zoo2_datalog:
  zoo3_data:
  zoo3_datalog:

networks:
  bigdata-net:
    external: true
