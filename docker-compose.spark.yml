services:
  spark-master:
    image: bigdata-spark:latest
    container_name: spark-master
    hostname: spark-master
    environment:
      - ROLE=master
      # 默认由挂载的 config/environment.conf 决定模式；
      # 只有宿主机显式设置 HADOOP_ENVIRONMENT 时才作为临时覆盖值传入。
      - HADOOP_ENVIRONMENT_OVERRIDE=${HADOOP_ENVIRONMENT:-}
      # PySpark Driver 与 Executor 统一使用 Python 3。
      - PYSPARK_PYTHON=/usr/bin/python3
      - PYSPARK_DRIVER_PYTHON=/usr/bin/python3
      - PYTHONPATH=/opt/spark/python:/opt/spark/python/lib/py4j-0.10.9-src.zip
    volumes:
      - ./config/spark:/config/spark
      - ./config/hadoop:/config/hadoop
      - ./config/hadoop-ha:/config/hadoop-ha
      - ./config/environment.conf:/config/environment.conf:ro
      - ./data/spark/logs:/opt/spark/logs
    ports:
      # Windows(WSL2/Hyper-V)会动态保留一批TCP端口，7077与18080可能落入排除区间导致
      # "bind: forbidden by its access permissions"（Docker Desktop 报 HTTP 500）。
      # 故宿主机侧改用 17077 / 18082；容器内部端口仍是 7077 / 18080，集群配置无需改动。
      - "17077:7077"  # Spark Master端口（宿主机 17077 -> 容器 7077）
      - "8080:8080"  # Spark Master Web UI
      - "18082:18080"  # Spark History Server（宿主机 18082 -> 容器 18080；18081 已被 Flink 占用）
      - "4040:4040"  # Spark Application UI（运行中应用的 Driver Web UI）
    expose:
      - "22"  # 仅供bigdata-net内部通过SSH批量管理Worker，不映射到宿主机
    networks:
      - bigdata-net

  spark-worker1:
    image: bigdata-spark:latest
    container_name: spark-worker1
    hostname: spark-worker1
    environment:
      - ROLE=worker
      # 未设置宿主机变量时保持为空，让共享环境配置文件生效。
      - HADOOP_ENVIRONMENT_OVERRIDE=${HADOOP_ENVIRONMENT:-}
      # Worker 会启动 Python Worker 进程，解释器必须与 Driver 一致。
      - PYSPARK_PYTHON=/usr/bin/python3
      - PYSPARK_DRIVER_PYTHON=/usr/bin/python3
      - PYTHONPATH=/opt/spark/python:/opt/spark/python/lib/py4j-0.10.9-src.zip
    volumes:
      - ./config/spark:/config/spark
      - ./config/hadoop:/config/hadoop
      - ./config/hadoop-ha:/config/hadoop-ha
      - ./config/environment.conf:/config/environment.conf:ro
      - ./data/spark/logs:/opt/spark/logs
    ports:
      - "8081:8081"  # Spark Worker Web UI
    expose:
      - "22"  # 接收spark-master发起的免密SSH管理命令
    networks:
      - bigdata-net
    depends_on:
      - spark-master

  spark-worker2:
    image: bigdata-spark:latest
    container_name: spark-worker2
    hostname: spark-worker2
    environment:
      - ROLE=worker
      # 未设置宿主机变量时保持为空，让共享环境配置文件生效。
      - HADOOP_ENVIRONMENT_OVERRIDE=${HADOOP_ENVIRONMENT:-}
      # Worker 会启动 Python Worker 进程，解释器必须与 Driver 一致。
      - PYSPARK_PYTHON=/usr/bin/python3
      - PYSPARK_DRIVER_PYTHON=/usr/bin/python3
      - PYTHONPATH=/opt/spark/python:/opt/spark/python/lib/py4j-0.10.9-src.zip
    volumes:
      - ./config/spark:/config/spark
      - ./config/hadoop:/config/hadoop
      - ./config/hadoop-ha:/config/hadoop-ha
      - ./config/environment.conf:/config/environment.conf:ro
      - ./data/spark/logs:/opt/spark/logs
    ports:
      - "8082:8081"  # Spark Worker Web UI
    expose:
      - "22"  # 接收spark-master发起的免密SSH管理命令
    networks:
      - bigdata-net
    depends_on:
      - spark-master

networks:
  bigdata-net:
    external: true
