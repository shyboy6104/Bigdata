<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 大数据实验平台</title>
<style>
  :root {
    --bg: #0f1419; --panel: #171d26; --panel2: #1e2632; --border: #2a3340;
    --text: #e6edf3; --muted: #8b98a9; --accent: #3b82f6; --accent-h: #2563eb;
    --green: #22c55e; --red: #ef4444; --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background-image: radial-gradient(ellipse at 20% -10%, rgba(59,130,246,.13), transparent 55%),
                      radial-gradient(ellipse at 90% 110%, rgba(6,182,212,.10), transparent 50%);
  }
  .card {
    width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 30px 28px 26px; box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  .logo { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; }
  .logo .sub { display: block; font-size: 11.5px; color: var(--muted); font-weight: 400; margin-top: 2px; }
  .form { margin-top: 22px; display: flex; flex-direction: column; gap: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
  .field input {
    width: 100%; background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    border-radius: 9px; padding: 10px 12px; font-size: 14px; outline: none; font-family: inherit;
  }
  .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
  .msg { display: none; font-size: 12.5px; border-radius: 8px; padding: 8px 11px; }
  .msg.err { display: block; color: #fca5a5; background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.3); }
  .btn {
    width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--accent); border: 1px solid var(--accent); color: #fff;
    padding: 11px 14px; border-radius: 9px; cursor: pointer; font-size: 14.5px; font-weight: 600;
    font-family: inherit; transition: .15s;
  }
  .btn:hover { background: var(--accent-h); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .foot { margin-top: 18px; font-size: 11.5px; color: var(--muted); text-align: center; }
  .foot a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">🐘 大数据实验平台 <span style="font-size:11.5px;color:var(--muted);font-weight:400;margin-left:auto">v2</span>
    <span class="sub" style="margin-left:0">Docker 容器化管理 · 多用户隔离</span>
  </div>
  <form class="form" id="loginForm" autocomplete="on">
    <div class="field">
      <label for="username">用户名</label>
      <input id="username" name="username" type="text" autofocus autocomplete="username" placeholder="请输入用户名" required>
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
    </div>
    <div class="msg" id="msg"></div>
    <button class="btn" type="submit" id="btnLogin">登 录</button>
  </form>
  <div class="foot">账号由服务器管理员分配 · 每个用户拥有独立容器环境</div>
</div>

<script>
(function () {
  // 本页必须由 relay 提供（http://<服务器IP>:<端口>/login），始终同源；
  // 会话 Cookie 为 SameSite=Lax，只有同源请求才会携带，直接双击 HTML / 静态预览无法登录。
  const API_BASE = '';
  const form = document.getElementById('loginForm');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btnLogin');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'msg';
    btn.disabled = true;
    btn.textContent = '登录中…';
    try {
      const r = await fetch(API_BASE + '/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
        }),
      });
      const data = await r.json();
      if (!r.ok || !data.ok) {
        msg.textContent = data.error || '登录失败';
        msg.className = 'msg err';
        return;
      }
      location.href = (data.role === 'admin') ? API_BASE + '/' : API_BASE + '/portal';
    } catch (err) {
      msg.textContent = '无法连接服务器：' + (err && err.message ? err.message : err);
      msg.className = 'msg err';
    } finally {
      btn.disabled = false;
      btn.textContent = '登 录';
    }
  });
})();
</script>
</body>
</html>
